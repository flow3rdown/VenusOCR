[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venusocr"
version = "0.1.0"
description = "VenusOCR - Document parsing powered by the VenusOCR vision-language model"
authors = [
  {name = "VenusOCR Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["ocr", "document-parsing", "vlm", "pdf", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "openai>=1.0.0",
  "numpy>=1.24.0",
  "Pillow>=9.0.0",
  "pypdfium2>=4.0.0",
  "opencv-contrib-python>=4.5.0",
  "shapely>=2.0.0",
  "PyYAML>=6.0.0",
  "pydantic>=2.0.0",
  "tqdm>=4.62.0",
]

[project.optional-dependencies]
paddlex = [
  "paddlex==3.6.0",
]
transformers = [
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers==5.5.4",
]
demo = [
  "gradio>=4.0.0",
]
serve = [
  "vllm==0.20.0",
  "transformers==5.5.4",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "PyMuPDF>=1.24.0",
  "black>=24.0.0",
  "ruff>=0.5.0",
  "pre-commit>=3.5.0",
]
all = [
  "paddlex==3.6.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers==5.5.4",
  "gradio>=4.0.0",
  "vllm==0.20.0",
]

[project.scripts]
venusocr = "venusocr.cli:main"

# vLLM out-of-tree model plugin: vLLM auto-loads this at import time and
# registers VenusOCRForConditionalGeneration, no vLLM source patch needed.
[project.entry-points."vllm.general_plugins"]
venusocr = "venusocr.vllm_plugin:register"

[project.urls]
Homepage = "https://github.com/VenusOCR/VenusOCR"
Repository = "https://github.com/VenusOCR/VenusOCR"
Documentation = "https://github.com/VenusOCR/VenusOCR#readme"
Issues = "https://github.com/VenusOCR/VenusOCR/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["venusocr*"]

[tool.setuptools.package-data]
venusocr = ["config.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
